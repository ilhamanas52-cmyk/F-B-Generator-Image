// Batas aman PANJANG URL SETELAH DI-ENCODE (bukan panjang teks mentah)
// — diukur dari prompt normal tab Promo (~2700 karakter encoded, itu
// aman/normal), dikasih ruang lebih supaya tidak salah tangkap prompt
// wajar sebagai "kepanjangan". Kalau memang melebihi ini, teks dipotong
// otomatis (bukan clipboard/alert — itu sering diblokir di sandbox
// Canvas) supaya tetap ada yang otomatis terisi, walau ujungnya terpotong.
const MAX_ENCODED_URL_LENGTH = 4500;
const openChatGPTWithPrompt = fullPrompt => {
  let text = fullPrompt;
  let encoded = encodeURIComponent(text);
  while (encoded.length > MAX_ENCODED_URL_LENGTH && text.length > 200) {
    text = text.slice(0, text.length - 200);
    encoded = encodeURIComponent(text);
  }
  const url = `https://chatgpt.com/?q=${encoded}`;
  window.open(url, '_blank');
  return url; // dikembalikan supaya pemanggil bisa tampilkan link cadangan manual
};

const parseContentPlan = text => {
  // Pecah berdasarkan pola "HARI <angka>" itu SENDIRI (bukan tanda
  // "###") — karena AI kadang lupa menambahkan "###" di tiap hari,
  // tapi hampir selalu tetap menulis "HARI 1", "HARI 2", dst sebagai
  // bagian dari kontennya. Jauh lebih tahan terhadap format yang
  // sedikit meleset dari instruksi.
  const blocks = text.split(/(?=HARI\s+\d+\s*\n)/i).map(b => b.trim()).filter(Boolean);
  const days = [];
  blocks.forEach(block => {
    if (!/^HARI\s+\d+/i.test(block)) return; // lewati bagian sebelum HARI 1 (instruksi awal yang ikut ter-paste)
    const temaMatch = block.match(/Tema:\s*(.+)/i);
    const konsepMatch = block.match(/Konsep:\s*(.+)/i);
    const ideMatch = block.match(/Ide Konten:\s*(.+)/i);
    const fotoMatch = block.match(/Konsep Foto\s*\/?\s*Desain:\s*(.+)/i);
    // Prompt Gambar berhenti SEBELUM "HARI <angka>" berikutnya muncul
    // lagi — jaring pengaman supaya tidak "menelan" isi hari-hari
    // sesudahnya kalau kebetulan masih tergabung dalam 1 blok.
    const promptMatch = block.match(/Prompt Gambar:\s*([\s\S]+?)(?=\n\s*HARI\s+\d+|$)/i);
    days.push({
      day: days.length + 1,
      // selalu urut sesuai posisi asli, bukan angka yang ditulis ChatGPT — supaya tidak pernah dobel
      tema: temaMatch ? temaMatch[1].trim() : '',
      konsep: konsepMatch ? konsepMatch[1].trim() : '',
      ide: ideMatch ? ideMatch[1].trim() : '',
      konsepFoto: fotoMatch ? fotoMatch[1].trim() : '',
      promptGambar: promptMatch ? promptMatch[1].trim() : ''
    });
  });
  return days;
};

const getTextLayout = (canvasHeight, areaTop, lineWeights) => {
  const bottomMargin = canvasHeight * 0.06;
  const topPadding = canvasHeight * 0.05;
  const areaHeight = canvasHeight - areaTop;
  const usableHeight = areaHeight - bottomMargin - topPadding;
  const totalWeight = lineWeights.reduce((a, b) => a + b, 0);
  const unitHeight = usableHeight / totalWeight;
  let cursorTop = areaTop + topPadding;
  const positions = [];
  for (let i = 0; i < lineWeights.length; i++) {
    const rowHeight = unitHeight * lineWeights[i];
    const fontSize = Math.max(14, rowHeight * 0.5);
    const baselineY = cursorTop + fontSize * 0.85;
    positions.push({
      y: baselineY,
      fontSize
    });
    cursorTop += rowHeight;
  }
  return positions;
};
const drawWrappedText = (ctx, text, x, y, maxWidth, lineHeight, fontSize, font) => {
  ctx.font = `${fontSize}px "${font}"`;
  const paragraphs = text.split('\n');
  let currentY = y;
  for (const paragraph of paragraphs) {
    const words = paragraph.split(' ');
    let line = '';
    if (words.length === 1 && words[0] === '') {
      currentY += lineHeight;
      continue;
    }
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      if (ctx.measureText(testLine).width > maxWidth && n > 0) {
        ctx.fillText(line, x, currentY);
        line = words[n] + ' ';
