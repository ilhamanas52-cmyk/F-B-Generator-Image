// clipboard dan buka ChatGPT kosong, minta pengguna tempel manual —
// daripada gagal total seperti membuka halaman error.
// Batas aman PANJANG URL SETELAH DI-ENCODE (bukan panjang teks mentah)
// — diukur dari prompt normal tab Promo (~2700 karakter encoded, itu
// aman/normal), dikasih ruang lebih supaya tidak salah tangkap prompt
// wajar sebagai "kepanjangan". Kalau memang melebihi ini, teks dipotong
// otomatis (bukan clipboard/alert — itu sering diblokir di sandbox
// Canvas) supaya tetap ada yang otomatis terisi, walau ujungnya terpotong.
const MAX_ENCODED_URL_LENGTH = 4500;
const openChatGPTWithPrompt = fullPrompt => {
  let text = fullPrompt;
  let encoded = encodeURIComponent(text);
  while (encoded.length > MAX_ENCODED_URL_LENGTH && text.length > 200) {
    text = text.slice(0, text.length - 200);
    encoded = encodeURIComponent(text);
  }
  const url = `https://chatgpt.com/?q=${encoded}`;
  window.open(url, '_blank');
  return url; // dikembalikan supaya pemanggil bisa tampilkan link cadangan manual
};

// (Promo, Menu, Konten 30 Hari, 9 Feed Konsisten, Banner Cetak). Di HP

// gambar SUDAH terlampir, tinggal pilih WhatsApp. Di desktop/browser
// yang tidak dukung share file (keterbatasan teknis browser, bukan
// bug), otomatis fallback: download dulu, lalu buka WhatsApp Web
// dengan teks siap pakai — gambar tinggal dilampirkan manual sekali.
// downloadFn: fungsi download yang SUDAH ADA di tiap komponen (dipanggil
// ulang untuk fallback, supaya nama filenya konsisten dengan tombol
// Download di komponen yang sama).
const shareImageToWhatsApp = async (canvas, filename, shareText, downloadFn) => {
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  const file = new File([blob], filename, {
    type: 'image/png'
  });
  if (navigator.canShare && navigator.canShare({
    files: [file]
  })) {
    await navigator.share({
      files: [file],
      title: 'Bagikan',
      text: shareText
    });
  } else {
    downloadFn();
    window.open(`https://wa.me/?text=${encodeURIComponent(shareText + ' (gambar sudah didownload, tinggal lampirkan di chat WhatsApp)')}`, '_blank');
  }
};

const pickVariant = (bank, lastIndexRef) => {
  if (bank.length === 1) return bank[0];
  let idx;
  do {
    idx = Math.floor(Math.random() * bank.length);

  lastIndexRef.current = idx;

};

// milik user, disimpan di Firestore, TIDAK dikirim ke server kami).
// Dipanggil langsung dari browser (fetch), sama seperti pola generate
// gambar via ChatGPT di aplikasi ini — tanpa backend.
// Model gemini-2.5-flash: multimodal (terima gambar+teks), ada kuota
// gratis harian yang cukup untuk skala UMKM per Juli 2026.
// ============================================================
const GEMINI_VISION_MODEL = 'gemini-3.5-flash';
const analyzeImageWithGemini = async (apiKey, imageDataUrl, instruction) => {
  if (!apiKey) throw new Error('API key Gemini belum diisi. Simpan dulu di tab Brand.');
  const match = imageDataUrl.match(/^data:(image\/[a-zA-Z]+);base64,(.+)$/);
  if (!match) throw new Error('Format foto tidak valid.');
  const mimeType = match[1];
  const base64Data = match[2];
  let resp;
  try {
    resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_VISION_MODEL}:generateContent`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-goog-api-key': apiKey
      },
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: instruction
          }, {
            inline_data: {
              mime_type: mimeType,
              data: base64Data
            }
          }]
        }]
      })
    });
  } catch (e) {
    throw new Error('Gagal menghubungi Gemini API — cek koneksi internet.');
  }
  if (!resp.ok) {
    let detail = '';
    try {
      const errJson = await resp.json();
      detail = errJson?.error?.message || '';
    } catch (e) {}
    if (resp.status === 400 || resp.status === 403) throw new Error(`API key ditolak (${resp.status}). Cek kembali API key di tab Brand. ${detail}`);
    if (resp.status === 429) throw new Error('Kuota Gemini API harian/menit habis. Coba lagi nanti.');
    if (resp.status === 503) throw new Error('Server Gemini sedang sibuk (kelebihan permintaan sesaat) \u2014 ini biasanya sementara, coba lagi beberapa saat lagi.');
    throw new Error(`Gemini API error ${resp.status}. ${detail}`);
  }
  const data = await resp.json();
  const text = (data?.candidates?.[0]?.content?.parts || []).map(p => p.text).filter(Boolean).join(' ').trim();
  if (!text) throw new Error('Gemini tidak mengembalikan hasil teks (mungkin foto diblokir filter keamanan).');
  return text;
};

// Versi teks polos (tanpa gambar) dari Gemini — dipakai untuk tugas
// pencocokan foto (bukan analisis visual), lebih ringan/cepat.
const askGeminiText = async (apiKey, instruction) => {
  if (!apiKey) throw new Error('API key Gemini belum diisi.');
  let resp;
  try {
    resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_VISION_MODEL}:generateContent`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-goog-api-key': apiKey
      },
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: instruction
          }]
        }]
      })
    });
  } catch (e) {
    throw new Error('Gagal menghubungi Gemini API.');
  }
  if (!resp.ok) {
    if (resp.status === 400 || resp.status === 403) throw new Error(`API key ditolak (${resp.status}). Cek kembali API key di tab Brand.`);
    if (resp.status === 429) throw new Error('Kuota Gemini API harian/menit habis. Coba lagi nanti.');
    if (resp.status === 503) throw new Error('Server Gemini sedang sibuk (kelebihan permintaan sesaat) \u2014 ini biasanya sementara, coba lagi beberapa saat lagi.');
    throw new Error(`Gemini API error ${resp.status}`);
  }
  const data = await resp.json();
  const text = (data?.candidates?.[0]?.content?.parts || []).map(p => p.text).filter(Boolean).join(' ').trim();
  if (!text) throw new Error('Gemini tidak mengembalikan hasil.');
  return text;
};

// ============================================================
// PERPUSTAKAAN FOTO ACUAN — dipakai tab Konten 30 Hari & 9 Feed
// Konsisten (maks 10 foto, tanpa label manual dari user). Tiap foto
// otomatis dianalisis SEKALI saat upload (label singkat + deskripsi
// detail bentuk asli), lalu saat generate 1 unit konten (hari/slot),
// sistem otomatis MENCOCOKKAN foto mana yang paling relevan dengan
// topik konten itu — semuanya otomatis, tanpa konfirmasi manual.
// ============================================================
const analyzePhotoForLibrary = async (apiKey, imageDataUrl) => {
  const instruction = 'Analisis foto ini untuk 2 tujuan. Jawab PERSIS dengan format berikut (2 baris saja, tanpa embel-embel lain, tanpa markdown):\nLABEL: (label singkat 3-6 kata tentang objek utama foto ini, contoh: "kopi latte dalam gelas kaca", "tampak depan restoran dengan signage", "staff crew dapur berseragam")\nDETAIL: (deskripsi detail 2-3 kalimat tentang bentuk fisik, warna, tekstur, dan ciri visual presisi objek tersebut, untuk jadi acuan AI image generator supaya tidak mengarang bentuk)';
  const text = await analyzeImageWithGemini(apiKey, imageDataUrl, instruction);
  const labelMatch = text.match(/LABEL:\s*(.+)/i);
  const detailMatch = text.match(/DETAIL:\s*([\s\S]+)/i);
  return {
    label: labelMatch ? labelMatch[1].trim() : text.slice(0, 60),
    detail: detailMatch ? detailMatch[1].trim() : text
  };
};

// Diberikan teks topik konten (Tema/Konsep/dll) dan daftar foto yang
// sudah dianalisis (label+detail), minta Gemini memilihkan foto PALING
// relevan — atau null kalau memang tidak ada yang cocok. Semua otomatis,
// tidak pernah menunjukkan kegagalan sebagai error mengganggu (kalau
// gagal, generate tetap lanjut TANPA foto acuan).
const pickBestMatchingPhoto = async (apiKey, topicText, photoLibrary) => {
  const validPhotos = (photoLibrary || []).filter(p => p.detail && !p.analyzing && !p.error);
  if (validPhotos.length === 0 || !topicText || !apiKey) return null;
  const listText = validPhotos.map((p, i) => `${i + 1}. ${p.label}`).join('\n');
  const instruction = `Ada topik konten berikut: "${topicText}". Berikut daftar foto yang tersedia:\n${listText}\nManakah foto yang PALING relevan/berkaitan dengan topik di atas? Jawab HANYA dengan nomornya saja (contoh: "2"), atau jawab persis "tidak ada" kalau memang tidak ada yang relevan. Jangan jawab apa pun selain itu.`;
  try {
    const resp = await askGeminiText(apiKey, instruction);
    const numMatch = resp.match(/\d+/);
    const num = numMatch ? parseInt(numMatch[0], 10) : NaN;
    if (num >= 1 && num <= validPhotos.length) return validPhotos[num - 1];
    return null;
  } catch (e) {
    return null;
  }
};

// Rakit Lapis 2-6 jadi 1 blok teks siap pakai. Dipanggil dari
// komponen yang SUDAH memilih varian (lewat pickVariant + useRef
// masing-masing), supaya anti-pengulangan bekerja per-komponen.
// respectStyleRef: true kalau user sudah menerapkan hasil analisis
// "Foto Referensi Gaya" (Vision AI) ke Arahan AI untuk generate ini —
// pencahayaan/komposisi/sudut acak DAN kunci warna brand dilepas
// supaya tidak bentrok dengan gaya dari foto referensi (lihat diskusi
// bug angle+warna berbeda dari referensi).
const buildEnrichedPromptExtras = (brand, {
  lighting,
  composition,
  frameDepthContrast,
  action,
  // { text, hands } atau null kalau mode Statis
  fontHeading,
  fontBody,
  respectStyleRef = false
} = {}) => {
  const fh = fontHeading || brand.fontHeading;
  const fb = fontBody || brand.fontBody;
  const parts = [];
  if (respectStyleRef) {
    // Lewati pencahayaan/komposisi/sudut ACAK — biarkan deskripsi gaya
    // dari foto referensi (sudah ada di Arahan AI) yang jadi acuan.
    parts.push('PENTING: Instruksi di atas SUDAH menyertakan deskripsi gaya visual (pencahayaan, komposisi, sudut kamera, palet warna) dari foto referensi yang diberikan user. WAJIB ikuti PERSIS deskripsi tersebut untuk pencahayaan, komposisi, sudut pengambilan gambar, dan palet warna — JANGAN gunakan variasi komposisi/sudut/warna lain di luar yang sudah dijelaskan di sana, dan JANGAN memakai warna brand default.');
  } else {
    parts.push(lighting, composition, frameDepthContrast);
  }
  if (action) {
    parts.push(action.text);
    if (action.hands) parts.push(HYGIENE_SOP_TEXT);
  }
  if (!respectStyleRef) {
    const colorLock = `Palet warna WAJIB sesuai brand — ${brand.primaryColor} untuk aksen tegas, ${brand.secondaryColor} untuk kontras kuat, ${brand.accentColor} untuk menonjolkan elemen promo/CTA, gunakan PERSIS kode HEX ini (bukan pendekatan warna lain).`;
    parts.push(colorLock);
  }
  const typography = `Kalau ada teks, pakai gaya font tebal besar bergaya "${fh}" untuk judul/headline (dengan tekstur/finishing yang sesuai gaya font-nya, bukan flat polos), gaya bersih "${fb}" untuk isi. Badge (kalau ada) sedikit dimiringkan/dirotasi, jangan sejajar sempurna.`;
  parts.push(typography);
  parts.push(QUALITY_PROHIBITION_LAYER);
  return parts.join(' ');
};

          const blockColor = COLOR_BLOCK_PALETTE[itemIndex % COLOR_BLOCK_PALETTE.length];
          const bx = marginX,
            by = y,
            bw = width - marginX * 2,
            bh = blockH;

          // Blok warna solid, sudut sangat membulat (kesan pil)
          roundRectPath(ctx, bx, by, bw, bh, bh / 2);
          ctx.fillStyle = blockColor;
          ctx.fill();

          // Foto PERSEGI disisipkan RAPI di dalam blok (bukan lingkaran
          // menjorok keluar lagi) — sudut membulat kecil menyesuaikan
          // sudut pil blok, foto tetap apa adanya (tanpa crop bulat/cutout).
          let textStartX = bx + 40;
          if (item.photoUrl) {
            try {
              const thumbImg = await loadImg(item.photoUrl);
              if (cancelled) return;
              const pad = bh * 0.14;
              const photoSize = bh - pad * 2;
              const px = bx + pad;
              const py = by + pad;
              ctx.save();
              roundRectPath(ctx, px, py, photoSize, photoSize, 16);
              ctx.clip();
              drawCoverImage(ctx, thumbImg, px, py, photoSize, photoSize);
              ctx.restore();
              ctx.strokeStyle = '#FFFFFF';
              ctx.lineWidth = 4;
              roundRectPath(ctx, px, py, photoSize, photoSize, 16);
              ctx.stroke();
              textStartX = px + photoSize + 28;
              if (item.featured) drawFeaturedBadge(ctx, px + photoSize - 10, py - 6, 0.55, 'inset-topright');
            } catch (e) {}
          }

          // Nama & deskripsi di atas blok warna
          ctx.fillStyle = cfg.textMain;
          ctx.font = `bold ${nameFontSize}px "${brand.fontBody}"`;
          ctx.fillText(item.name, textStartX, by + bh / 2 - (item.description ? 6 : -8), bx + bw - textStartX - 110);
          if (item.description) {
            ctx.fillStyle = cfg.textSub;
            ctx.font = `${descFontSize}px "${brand.fontBody}"`;
            ctx.fillText(item.description, textStartX, by + bh / 2 + descFontSize + 2, bx + bw - textStartX - 110);
          }

          // Label harga menjorok di sudut atas-kanan blok — putih dengan
          // teks warna blok, kesan "flag" menonjol (bukan teks polos)
          drawPriceBadge(ctx, `Rp ${item.price.toLocaleString('id-ID')}`, bx + bw - 55, by + 6, {
            scale: Math.max(vScale, 0.7),
            shape: 'pill',
            bg: '#FFFFFF',
            textColor: blockColor,
            fontSize: 20
          });
          itemIndex++;
          y += blockH + blockGap;
        }
      }
    };

    // ============================================================
    // B) DINER LIST (gaya Klasik) — 1 kolom, foto MEDIUM (lebih besar
    // dari list biasa), badge harga bentuk PIL menjorok di sudut foto.
    // ============================================================
    const renderDinerListLayout = async (canvas, ctx, width, grouped, cfg) => {
      const headerH = await computeHeaderHeight(brand);
      const catHeaderHBase = 70,
        rowHBase = 156,
        bottomPad = 60;
      const totalRows = grouped.reduce((sum, g) => sum + g.list.length, 0);
      const naturalBodyHeight = grouped.length * catHeaderHBase + totalRows * rowHBase;
      if (cancelled) return;
      canvas.width = A4_WIDTH * renderScale;
      canvas.height = A4_HEIGHT * renderScale;
      ctx.scale(renderScale, renderScale);
      ctx.fillStyle = cfg.pageBg;
      ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT);
      if (backgroundImage) {
        const img = new Image();
        img.src = backgroundImage;
        await new Promise(r => img.onload = r);
        if (cancelled) return;
        drawCoverImage(ctx, img, 0, 0, A4_WIDTH, A4_HEIGHT);
        ctx.fillStyle = cfg.pageBg + 'C7';
        ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT); // ~78% opacity overlay warna khas gaya
      }
      if (cancelled) return;
      await renderHeader(ctx, A4_WIDTH, brand);
      await document.fonts.load(`bold 34px "${brand.fontHeading}"`);
      await document.fonts.load(`bold 30px "${brand.fontBody}"`);
      await document.fonts.load(`22px "${brand.fontBody}"`);
      if (cancelled) return;

      // HANYA metrik VERTIKAL yang dipadatkan kalau kepanjangan — lebar
      // (ukuran thumbnail medium) tidak pernah mengecil drastis, supaya
      // ciri khas "foto besar" gaya ini tetap terasa.
      const availableBody = A4_HEIGHT - headerH - bottomPad;
      const vScale = naturalBodyHeight > availableBody ? Math.max(0.4, availableBody / naturalBodyHeight) : 1;
      const catHeaderH = catHeaderHBase * vScale;
      const rowH = rowHBase * vScale;
      const thumbSize = Math.max(70, 130 * vScale); // ~110-140px di skala penuh sesuai brief "medium"
      const nameFontSize = Math.round(30 * Math.max(vScale, 0.65));
      const descFontSize = Math.round(22 * Math.max(vScale, 0.65));
      let y = headerH;
      const marginX = 60;
      for (const group of grouped) {
        ctx.fillStyle = cfg.dividerColor;
        ctx.font = `bold 34px "${brand.fontHeading}"`;
        ctx.fillText(group.cat.toUpperCase(), marginX, y + 45);
        ctx.strokeStyle = cfg.dividerColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(marginX, y + 58);
        ctx.lineTo(width - marginX, y + 58);
        ctx.stroke();
        y += catHeaderH;
        for (const item of group.list) {
          const priceText = `Rp ${item.price.toLocaleString('id-ID')}`;
          if (item.photoUrl) {
            try {
              const thumbImg = new Image();
              thumbImg.src = item.photoUrl;
              await new Promise(r => thumbImg.onload = r);
              if (cancelled) return;
              drawCoverImage(ctx, thumbImg, marginX, y + 10, thumbSize, thumbSize);
              // Badge harga PIL sejajar dengan foto (di tengah tinggi foto,
              // menjorok sedikit ke kanan) — sebelumnya di sudut bawah foto,
              // sampai tumpang tindih dengan baris item berikutnya.
              drawPriceBadge(ctx, priceText, marginX + thumbSize, y + 10 + thumbSize / 2, {
                scale: Math.max(vScale, 0.7),
                shape: 'pill',
                bg: brand.primaryColor,
                fontSize: 22
              });
            } catch (e) {}
          }
          const textX = item.photoUrl ? marginX + thumbSize + 24 : marginX;
          ctx.fillStyle = cfg.textMain;
          ctx.font = `bold ${nameFontSize}px "${brand.fontBody}"`;
          ctx.fillText(item.name, textX, y + nameFontSize + 8, width - marginX - textX);
          if (item.featured) {
            const nameW = ctx.measureText(item.name).width;
            drawFeaturedBadge(ctx, textX + nameW + 14, y + nameFontSize / 2 + 2, 0.6, 'left-middle');
          }
          if (item.description) {
            ctx.fillStyle = cfg.textSub;
            ctx.font = `${descFontSize}px "${brand.fontBody}"`;
            ctx.fillText(item.description, textX, y + nameFontSize + descFontSize + 12, width - marginX - textX);
          }
          // Tanpa foto: harga tetap ditampilkan, sebagai pil kecil menempel setelah nama
          if (!item.photoUrl) {
            const nameW = ctx.measureText(item.name).width;
            drawPriceBadge(ctx, priceText, width - marginX - 50, y + nameFontSize / 2 + 2, {
              scale: Math.max(vScale, 0.7) * 0.9,
              shape: 'pill',
              bg: brand.primaryColor,
              fontSize: 20
            });
          }
          y += rowH;
        }
      }
    };

    // ============================================================
    // C) BUBBLE STRIP (gaya Playful) — 1 kolom, foto BULAT KECIL
    // berjajar (bukan kartu foto besar), baris ramping & rapat,
    // harga teks sederhana rata-kanan.
    // ============================================================
    // ============================================================
    // FOTO BULAT BERTUMPUK — referensi: poster menu "Gourmet Boss".
    // Header ringkas (logo kecil rata kiri) + judul raksasa "DAFTAR
    // MENU", strip warna vertikal di sisi kiri, foto BULAT BESAR
    // bertumpuk sepanjang strip, harga pakai dotted-leader dengan
    // jarak antar-baris lega.
    // ============================================================
    const renderPhotoStackLayout = async (canvas, ctx, width, grouped, cfg) => {
      const headerH = await computeCompactHeaderHeight(brand);
      const heroTitleH = 92; // ruang untuk judul raksasa di bawah header ringkas
      const bodyTop = headerH + heroTitleH;
      const catHeaderHBase = 50,
        rowHBase = 96,
        bottomPad = 60;
      const totalRows = grouped.reduce((sum, g) => sum + g.list.length, 0);
      const naturalBodyHeight = grouped.length * catHeaderHBase + totalRows * rowHBase;
      const availableBody = A4_HEIGHT - bodyTop - bottomPad;
      const vScale = naturalBodyHeight > availableBody ? Math.max(0.4, availableBody / naturalBodyHeight) : 1;
      const catHeaderH = catHeaderHBase * vScale;
      const rowH = rowHBase * vScale;
      const photoSize = Math.max(48, 88 * vScale); // persegi, sedikit bertumpuk antar-baris — ciri khas gaya ini
      const nameFontSize = Math.round(27 * Math.max(vScale, 0.65));
      const descFontSize = Math.round(17 * Math.max(vScale, 0.65));
      if (cancelled) return;
      canvas.width = A4_WIDTH * renderScale;
      canvas.height = A4_HEIGHT * renderScale;
      ctx.scale(renderScale, renderScale);
      ctx.fillStyle = cfg.pageBg;
      ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT);
      if (backgroundImage) {
        const img = await loadImg(backgroundImage);
        if (cancelled) return;
        drawCoverImage(ctx, img, 0, 0, A4_WIDTH, A4_HEIGHT);
        ctx.fillStyle = cfg.pageBg + 'C7';
        ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT);
      }
      if (cancelled) return;
      await renderCompactHeader(ctx, brand);
      await document.fonts.load(`bold 62px "${brand.fontHeading}"`);
      await document.fonts.load(`bold 26px "${brand.fontHeading}"`);
      await document.fonts.load(`bold ${nameFontSize}px "${brand.fontBody}"`);
      await document.fonts.load(`${descFontSize}px "${brand.fontBody}"`);
      if (cancelled) return;

      // Judul raksasa — elemen hero halaman, ciri khas referensi
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `bold 62px "${brand.fontHeading}"`;
      ctx.fillText('DAFTAR MENU', 50, headerH + 60);
      const marginX = 50;
      const stripX = marginX;
      const stripW = photoSize + 40;

      // Strip warna vertikal di sepanjang badan menu — digambar penuh
      // dari awal, terlepas dari isi konten pas atau tidak (sengaja,
      // efek visual dari referensi).
      ctx.fillStyle = cfg.dividerColor;
      roundRectPath(ctx, stripX, bodyTop, stripW, A4_HEIGHT - bodyTop - bottomPad + 30, stripW / 2);
      ctx.fill();
      let y = bodyTop;
      let itemIndex = 0;
      for (const group of grouped) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = `bold 26px "${brand.fontHeading}"`;
        ctx.fillText(group.cat.toUpperCase(), stripX + stripW + 20, y + 24);
        y += catHeaderH;
        for (const item of group.list) {
          const cx = stripX + stripW / 2;
          const cy = y + photoSize / 2;
          if (item.photoUrl) {
            try {
              const thumbImg = await loadImg(item.photoUrl);
              if (cancelled) return;
              // Foto PERSEGI dimiringkan bergantian (kiri/kanan) — kesan
              // tumpukan polaroid, bukan lingkaran lagi. Foto tetap apa
              // adanya (tanpa crop bulat/cutout).
              const tilt = itemIndex % 2 === 0 ? -0.09 : 0.09;
              ctx.save();
              ctx.translate(cx, cy);
              ctx.rotate(tilt);
              ctx.fillStyle = '#000000';
              ctx.shadowColor = 'rgba(0,0,0,0.4)';
              ctx.shadowBlur = 10;
              roundRectPath(ctx, -photoSize / 2, -photoSize / 2, photoSize, photoSize, 8);
              ctx.fill();
              ctx.shadowBlur = 0;
              ctx.save();
              roundRectPath(ctx, -photoSize / 2, -photoSize / 2, photoSize, photoSize, 8);
              ctx.clip();
              drawCoverImage(ctx, thumbImg, -photoSize / 2, -photoSize / 2, photoSize, photoSize);
              ctx.restore();
              ctx.strokeStyle = '#FFFFFF';
              ctx.lineWidth = 4;
              roundRectPath(ctx, -photoSize / 2, -photoSize / 2, photoSize, photoSize, 8);
              ctx.stroke();
              ctx.restore();
            } catch (e) {}
          }
          itemIndex++;
          const textX = stripX + stripW + 24;
          const textY = cy - (item.description ? 6 : -4);
          const priceText = `Rp ${item.price.toLocaleString('id-ID')}`;
          ctx.font = `bold ${Math.round(nameFontSize * 0.85)}px "${brand.fontBody}"`;
          const priceW = ctx.measureText(priceText).width;
          const priceX = width - marginX - priceW;
          ctx.fillStyle = cfg.textMain;
          ctx.font = `bold ${nameFontSize}px "${brand.fontBody}"`;
          ctx.fillText(item.name, textX, textY, priceX - textX - 20);
          const nameW = Math.min(ctx.measureText(item.name).width, priceX - textX - 20);
          if (item.featured) drawFeaturedBadge(ctx, textX + nameW + 12, textY - nameFontSize / 2 + 2, 0.5, 'left-middle');
          drawDottedLeader(ctx, textX + nameW + 16, priceX - 10, textY - nameFontSize * 0.32, cfg.dividerColor);
          ctx.fillStyle = brand.primaryColor;
          ctx.font = `bold ${Math.round(nameFontSize * 0.85)}px "${brand.fontBody}"`;
          ctx.fillText(priceText, priceX, textY);
          if (item.description) {
            ctx.fillStyle = cfg.textSub;
            ctx.font = `${descFontSize}px "${brand.fontBody}"`;
            ctx.fillText(item.description, textX, textY + descFontSize + 4, width - marginX - textX);
          }
          y += rowH;
        }
      }
    };

    // ============================================================
    // HERO GLOW DRAMATIS — referensi: poster "The Burger House".
    // Header ringkas, judul raksasa efek GRADASI + GLOW (bukan warna
    // solid datar), foto item unggulan saling tumpuk-silang secara
    // diagonal di bawah judul, badge favorit/harga diberi efek glow.
    // Daftar harga di bagian bawah TANPA foto per-item (semua foto
    // sudah ditampilkan di kolase hero atas), sesuai referensi.
    // ============================================================
    const renderHeroGlowLayout = async (canvas, ctx, width, grouped, cfg) => {
      const headerH = await computeCompactHeaderHeight(brand);
      const titleH = 96;
      const collageH = 220;
      const bodyTop = headerH + titleH + collageH;
      const bottomPad = 50;
      const catHeaderHBase = 44,
        rowHBase = 46;
      const totalRows = grouped.reduce((sum, g) => sum + g.list.length, 0);
      const naturalBodyHeight = grouped.length * catHeaderHBase + totalRows * rowHBase;
      const availableBody = A4_HEIGHT - bodyTop - bottomPad;
      const vScale = naturalBodyHeight > availableBody ? Math.max(0.45, availableBody / naturalBodyHeight) : 1;
      const catHeaderH = catHeaderHBase * vScale;
      const rowH = rowHBase * vScale;
      const nameFontSize = Math.round(24 * Math.max(vScale, 0.65));
      if (cancelled) return;
      canvas.width = A4_WIDTH * renderScale;
      canvas.height = A4_HEIGHT * renderScale;
      ctx.scale(renderScale, renderScale);
      ctx.fillStyle = cfg.pageBg;
      ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT);
      if (backgroundImage) {
        const img = await loadImg(backgroundImage);
        if (cancelled) return;
        drawCoverImage(ctx, img, 0, 0, A4_WIDTH, A4_HEIGHT);
        ctx.fillStyle = cfg.pageBg + 'B8';
        ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT);
      }
      if (cancelled) return;
      await renderCompactHeader(ctx, brand);
      await document.fonts.load(`bold 74px "${brand.fontHeading}"`);
      await document.fonts.load(`bold 26px "${brand.fontHeading}"`);
      await document.fonts.load(`bold ${nameFontSize}px "${brand.fontBody}"`);
      if (cancelled) return;

      // Judul raksasa dengan GRADASI warna + GLOW (bukan warna solid datar)
      ctx.save();
      ctx.font = `bold 74px "${brand.fontHeading}"`;
      ctx.textAlign = 'center';
      const grad = ctx.createLinearGradient(0, headerH, 0, headerH + 74);
      grad.addColorStop(0, '#FFFFFF');
      grad.addColorStop(1, cfg.dividerColor);
      ctx.fillStyle = grad;
      ctx.shadowColor = cfg.dividerColor;
      ctx.shadowBlur = 26;
      ctx.fillText('DAFTAR MENU', width / 2, headerH + 62);
      ctx.restore();
      ctx.textAlign = 'left';

      // Kolase foto tumpuk-silang DIAGONAL — maksimal 3 item (prioritas
      // yang ditandai Menu Unggulan, sisanya diambil dari item pertama
      // yang punya foto), meniru komposisi "produk saling tumpuk" referensi.
      const allItems = grouped.flatMap(g => g.list);
      const withPhoto = allItems.filter(i => i.photoUrl);
      const featuredFirst = [...withPhoto.filter(i => i.featured), ...withPhoto.filter(i => !i.featured)].slice(0, 3);
      const collageY = headerH + titleH + collageH / 2;
      const collageSlots = [{
        dx: 0,
        rot: 0,
        size: 208,
        z: 2
      }, {
        dx: -190,
        rot: -0.16,
        size: 168,
        z: 0
      }, {
        dx: 190,
        rot: 0.16,
        size: 168,
        z: 1
      }];
      // Slot TENGAH (terbesar) selalu diprioritaskan lebih dulu — jadi kalau
      // cuma ada 1-2 foto tersedia, yang tampil adalah foto prioritas utama
      // di posisi paling menonjol, bukan kebetulan jatuh ke slot samping.
      const activeSlots = collageSlots.slice(0, featuredFirst.length).sort((a, b) => a.z - b.z);
      for (const slot of activeSlots) {
        const item = featuredFirst[collageSlots.indexOf(slot)];
        if (!item) continue;
        try {
          const img = await loadImg(item.photoUrl);
          if (cancelled) return;
          ctx.save();
          ctx.translate(width / 2 + slot.dx, collageY);
          ctx.rotate(slot.rot);
          ctx.shadowColor = 'rgba(0,0,0,0.5)';
          ctx.shadowBlur = 18;
          roundRectPath(ctx, -slot.size / 2, -slot.size / 2, slot.size, slot.size, 20);
          ctx.fillStyle = '#000000';
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.save();
          roundRectPath(ctx, -slot.size / 2, -slot.size / 2, slot.size, slot.size, 20);
          ctx.clip();
          drawCoverImage(ctx, img, -slot.size / 2, -slot.size / 2, slot.size, slot.size);
          ctx.restore();
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 4;
          roundRectPath(ctx, -slot.size / 2, -slot.size / 2, slot.size, slot.size, 20);
          ctx.stroke();
          ctx.restore();
        } catch (e) {}
      }

      // Daftar harga di bawah kolase — TANPA foto per-item (sesuai referensi),
      // badge favorit diberi efek glow.
      let y = bodyTop;
      const marginX = 60;
      for (const group of grouped) {
        ctx.fillStyle = cfg.dividerColor;
        ctx.font = `bold 26px "${brand.fontHeading}"`;
        ctx.fillText(group.cat.toUpperCase(), marginX, y + 22);
        y += catHeaderH;
        for (const item of group.list) {
          const priceText = `Rp ${item.price.toLocaleString('id-ID')}`;
          ctx.font = `bold ${Math.round(nameFontSize * 0.82)}px "${brand.fontBody}"`;
          const priceW = ctx.measureText(priceText).width;
          ctx.fillStyle = cfg.textMain;
          ctx.font = `bold ${nameFontSize}px "${brand.fontBody}"`;
          ctx.fillText(item.name, marginX, y + nameFontSize, width - marginX * 2 - priceW - 20);
          if (item.featured) {
            const nameW = ctx.measureText(item.name).width;
            ctx.save();
            ctx.shadowColor = cfg.dividerColor;
            ctx.shadowBlur = 14;
            drawFeaturedBadge(ctx, marginX + nameW + 14, y + nameFontSize / 2 + 2, 0.5, 'left-middle');
            ctx.restore();
          }
          ctx.save();
          ctx.shadowColor = cfg.dividerColor;
          ctx.shadowBlur = 10;
          ctx.fillStyle = cfg.dividerColor;
          ctx.font = `bold ${Math.round(nameFontSize * 0.82)}px "${brand.fontBody}"`;
          ctx.textAlign = 'right';
          ctx.fillText(priceText, width - marginX, y + nameFontSize);
          ctx.textAlign = 'left';
          ctx.restore();
          y += rowH;
        }
      }
    };

    // ============================================================
    // BENTO GRID MOSAIK — grid TIDAK BERATURAN (bukan list 1 kolom).
    // 1 item per kategori (favorit/pertama) dapat kotak BESAR (foto
    // dominan), sisanya dapat kotak KECIL berjajar di sebelahnya —
    // kerangka mosaik, satu-satunya di antara 6 gaya yang bukan
    // berbasis "baris demi baris ke bawah".
    // ============================================================
    const renderBentoGridLayout = async (canvas, ctx, width, grouped, cfg) => {
      const headerH = await computeHeaderHeight(brand);
      const catHeaderHBase = 50,
        bottomPad = 50,
        gapBase = 14,
        marginX = 40;
      // Tinggi 1 "unit baris mosaik" (1 kotak besar + kolom kotak kecil
      // di sebelahnya) dihitung dari jumlah item kecil per kategori.
      const rowUnitBase = 190;
      const totalUnits = grouped.length; // 1 unit mosaik per kategori
      const naturalBodyHeight = grouped.length * catHeaderHBase + totalUnits * (rowUnitBase + gapBase);
      if (cancelled) return;
      canvas.width = A4_WIDTH * renderScale;
      canvas.height = A4_HEIGHT * renderScale;
      ctx.scale(renderScale, renderScale);
      ctx.fillStyle = cfg.pageBg;
      ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT);
      if (backgroundImage) {
        const img = await loadImg(backgroundImage);
        if (cancelled) return;
        drawCoverImage(ctx, img, 0, 0, A4_WIDTH, A4_HEIGHT);
        ctx.fillStyle = cfg.pageBg + 'CC';
        ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT);
      }
      if (cancelled) return;
      await renderHeader(ctx, A4_WIDTH, brand);
      await document.fonts.load(`bold 28px "${brand.fontHeading}"`);
      await document.fonts.load(`bold 20px "${brand.fontBody}"`);
      await document.fonts.load(`bold 15px "${brand.fontBody}"`);
      if (cancelled) return;
      const availableBody = A4_HEIGHT - headerH - bottomPad;
      const vScale = naturalBodyHeight > availableBody ? Math.max(0.45, availableBody / naturalBodyHeight) : 1;
      const catHeaderH = catHeaderHBase * vScale;
      const rowUnit = rowUnitBase * vScale;
      const gap = gapBase * vScale;
      const bigNameFont = Math.round(22 * Math.max(vScale, 0.6));
      const smallNameFont = Math.round(16 * Math.max(vScale, 0.6));
      const priceFont = Math.round(17 * Math.max(vScale, 0.6));
      let y = headerH;
      const drawTile = (item, tx, ty, tw, th, big) => {
        // Foto PERSEGI penuh 1 kotak (tetap apa adanya, tanpa crop
        // bulat/cutout) — mengisi seluruh area kotak sebagai latar,
        // teks nama+harga di-overlay gradasi gelap di bagian bawah.
        roundRectPath(ctx, tx, ty, tw, th, 10);
        ctx.save();
        ctx.clip();
        ctx.fillStyle = '#00000055';
        ctx.fillRect(tx, ty, tw, th);
        ctx.restore();
        const nameFont = big ? bigNameFont : smallNameFont;
        const padX = big ? 16 : 10;
        const padY = big ? 16 : 10;
        const grad = ctx.createLinearGradient(tx, ty + th * 0.4, tx, ty + th);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.75)');
        ctx.save();
        roundRectPath(ctx, tx, ty, tw, th, 10);
        ctx.clip();
        ctx.fillStyle = grad;
        ctx.fillRect(tx, ty, tw, th);
        ctx.restore();
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = 1.5;
