// Batas aman PANJANG URL SETELAH DI-ENCODE (bukan panjang teks mentah)
// — diukur dari prompt normal tab Promo (~2700 karakter encoded, itu
// aman/normal), dikasih ruang lebih supaya tidak salah tangkap prompt
// wajar sebagai "kepanjangan". Kalau memang melebihi ini, teks dipotong
// otomatis (bukan clipboard/alert — itu sering diblokir di sandbox
// Canvas) supaya tetap ada yang otomatis terisi, walau ujungnya terpotong.
const MAX_ENCODED_URL_LENGTH = 4500;
const openChatGPTWithPrompt = fullPrompt => {
  let text = fullPrompt;
  let encoded = encodeURIComponent(text);
  while (encoded.length > MAX_ENCODED_URL_LENGTH && text.length > 200) {
    text = text.slice(0, text.length - 200);
    encoded = encodeURIComponent(text);
  }
  const url = `https://chatgpt.com/?q=${encoded}`;
  window.open(url, '_blank');
  return url; // dikembalikan supaya pemanggil bisa tampilkan link cadangan manual
};

// lastIndexRef adalah useRef milik komponen pemanggil.
const pickVariant = (bank, lastIndexRef) => {
  if (bank.length === 1) return bank[0];
  let idx;
  do {
    idx = Math.floor(Math.random() * bank.length);
  } while (idx === lastIndexRef.current);
  lastIndexRef.current = idx;
  return bank[idx];
};

// ============================================================
// PERPUSTAKAAN FOTO ACUAN — dipakai tab Konten 30 Hari & 9 Feed
// Konsisten (maks 10 foto, tanpa label manual dari user). Tiap foto
// otomatis dianalisis SEKALI saat upload (label singkat + deskripsi
// detail bentuk asli), lalu saat generate 1 unit konten (hari/slot),
// sistem otomatis MENCOCOKKAN foto mana yang paling relevan dengan
// topik konten itu — semuanya otomatis, tanpa konfirmasi manual.
// ============================================================
const analyzePhotoForLibrary = async (apiKey, imageDataUrl) => {
  const instruction = 'Analisis foto ini untuk 2 tujuan. Jawab PERSIS dengan format berikut (2 baris saja, tanpa embel-embel lain, tanpa markdown):\nLABEL: (label singkat 3-6 kata tentang objek utama foto ini, contoh: "kopi latte dalam gelas kaca", "tampak depan restoran dengan signage", "staff crew dapur berseragam")\nDETAIL: (deskripsi detail 2-3 kalimat tentang bentuk fisik, warna, tekstur, dan ciri visual presisi objek tersebut, untuk jadi acuan AI image generator supaya tidak mengarang bentuk)';
  const text = await analyzeImageWithGemini(apiKey, imageDataUrl, instruction);
  const labelMatch = text.match(/LABEL:\s*(.+)/i);
  const detailMatch = text.match(/DETAIL:\s*([\s\S]+)/i);
  return {
    label: labelMatch ? labelMatch[1].trim() : text.slice(0, 60),
    detail: detailMatch ? detailMatch[1].trim() : text
  };
};

// Diberikan teks topik konten (Tema/Konsep/dll) dan daftar foto yang
// sudah dianalisis (label+detail), minta Gemini memilihkan foto PALING
// relevan — atau null kalau memang tidak ada yang cocok. Semua otomatis,
// tidak pernah menunjukkan kegagalan sebagai error mengganggu (kalau
// gagal, generate tetap lanjut TANPA foto acuan).
const pickBestMatchingPhoto = async (apiKey, topicText, photoLibrary) => {
  const validPhotos = (photoLibrary || []).filter(p => p.detail && !p.analyzing && !p.error);
  if (validPhotos.length === 0 || !topicText || !apiKey) return null;
  const listText = validPhotos.map((p, i) => `${i + 1}. ${p.label}`).join('\n');
  const instruction = `Ada topik konten berikut: "${topicText}". Berikut daftar foto yang tersedia:\n${listText}\nManakah foto yang PALING relevan/berkaitan dengan topik di atas? Jawab HANYA dengan nomornya saja (contoh: "2"), atau jawab persis "tidak ada" kalau memang tidak ada yang relevan. Jangan jawab apa pun selain itu.`;
  try {
    const resp = await askGeminiText(apiKey, instruction);
    const numMatch = resp.match(/\d+/);
    const num = numMatch ? parseInt(numMatch[0], 10) : NaN;
    if (num >= 1 && num <= validPhotos.length) return validPhotos[num - 1];
    return null;
  } catch (e) {
    return null;
  }
};

// Rakit Lapis 2-6 jadi 1 blok teks siap pakai. Dipanggil dari
// komponen yang SUDAH memilih varian (lewat pickVariant + useRef
// masing-masing), supaya anti-pengulangan bekerja per-komponen.
// respectStyleRef: true kalau user sudah menerapkan hasil analisis
// "Foto Referensi Gaya" (Vision AI) ke Arahan AI untuk generate ini —
// pencahayaan/komposisi/sudut acak DAN kunci warna brand dilepas
// supaya tidak bentrok dengan gaya dari foto referensi (lihat diskusi
// bug angle+warna berbeda dari referensi).
const buildEnrichedPromptExtras = (brand, {
  lighting,
  composition,
  frameDepthContrast,
  action,
  // { text, hands } atau null kalau mode Statis
  fontHeading,
  fontBody,
  respectStyleRef = false
} = {}) => {
  const fh = fontHeading || brand.fontHeading;
  const fb = fontBody || brand.fontBody;
  const parts = [];
  if (respectStyleRef) {
    // Lewati pencahayaan/komposisi/sudut ACAK — biarkan deskripsi gaya
    // dari foto referensi (sudah ada di Arahan AI) yang jadi acuan.
    parts.push('PENTING: Instruksi di atas SUDAH menyertakan deskripsi tertulis lengkap tentang gaya visual (pencahayaan, komposisi, sudut kamera, palet warna) — deskripsi teks itu SATU-SATUNYA acuan yang tersedia, TIDAK ADA file foto yang menyertai prompt ini. JANGAN meminta, menunggu, atau menyarankan upload foto apa pun — langsung buat gambarnya berdasarkan deskripsi teks tersebut. WAJIB ikuti PERSIS deskripsi tersebut untuk pencahayaan, komposisi, sudut pengambilan gambar, dan palet warna — JANGAN gunakan variasi komposisi/sudut/warna lain di luar yang sudah dijelaskan di sana, dan JANGAN memakai warna brand default.');
  } else {
    parts.push(lighting, composition, frameDepthContrast);
  }
  // FIX B: sebelumnya blok aksi ini tidak ikut dilewati saat respectStyleRef
  // aktif, jadi aksi ACAK tetap dipaksakan meski foto referensi sudah
  // menentukan ada/tidaknya aksi sendiri. Sekarang mode referensi punya
  // instruksi sendiri (ikuti PERSIS kalau disebutkan referensi, diam kalau
  // tidak), dan mode brand tetap acak tapi boleh diganti kalau janggal.
  if (respectStyleRef) {
    parts.push('Soal momen aksi (tangan menuang/menaburkan/dll): HANYA tambahkan aksi kalau deskripsi gaya visual referensi di atas secara eksplisit menyebutkan ada aksi/tangan manusia yang terlihat — kalau begitu, ikuti PERSIS jenis aksi tersebut sesuai deskripsi, dan tangan yang terlihat WAJIB memakai sarung tangan sekali pakai (nitrile/lateks berwarna terang) serta rambut tertutup hairnet di bawah topi koki. Kalau deskripsi referensi TIDAK menyebutkan aksi atau tangan apa pun, JANGAN menambahkan aksi apa pun — biarkan gambar statis sesuai referensi.');
  } else if (action) {
    parts.push(action.text);
    if (action.hands) parts.push(HYGIENE_SOP_TEXT);
    parts.push('Kalau aksi ini terasa janggal atau tidak masuk akal untuk jenis hidangan ini (misal menuangkan cairan ke makanan kering/renyah), boleh diganti ke variasi aksi lain yang lebih natural dan sesuai (uap mengepul, taburan kering, dll) — tetap pertahankan mood dinamis, jangan jadi statis polos.');
  }
  if (!respectStyleRef) {
    const colorLock = `Palet warna WAJIB sesuai brand — ${brand.primaryColor} untuk aksen tegas, ${brand.secondaryColor} untuk kontras kuat, ${brand.accentColor} untuk menonjolkan elemen promo/CTA, gunakan PERSIS kode HEX ini (bukan pendekatan warna lain).`;
    parts.push(colorLock);
    const textColorLock = `Warna TEKS (headline/sub-headline/CTA/badge) WAJIB ikut palet warna di atas atau warna yang benar-benar terlihat di deskripsi acuan (kalau ada) — BUKAN dipilih bebas oleh AI generator.`;
    const textColorNoBias = `JANGAN otomatis memilih warna teks putih/krem/netral hanya karena itu "aman" atau kontras tinggi secara default — ikuti warna spesifik yang sudah ditentukan di atas, walau warnanya bukan putih/krem.`;
    parts.push(textColorLock);
    parts.push(textColorNoBias);
  }
  const typography = respectStyleRef ? `Kalau ada teks, untuk HEADLINE (judul utama) gunakan gaya font DAN WARNA yang menyesuaikan mood/gaya visual (termasuk gaya font dan warna teks, kalau ada disebutkan) dari deskripsi foto referensi di atas — JANGAN gunakan font ATAU warna brand default untuk headline pada generate ini, dan JANGAN otomatis pakai warna kuning/merah generik ala iklan promo kalau warna itu tidak disebutkan di deskripsi referensi. Untuk Sub-headline dan teks CTA, tetap gunakan gaya font bersih ${fb} (tidak ikut menyesuaikan referensi, ini nama gaya font acuan visual, BUKAN teks yang harus tertulis di gambar). Badge dan tombol CTA (kalau ada) WAJIB pakai warna yang diambil dari palet warna referensi di atas (bukan kuning/merah default) — kalau deskripsi referensi menyebutkan warna dominan elemen grafis/teksnya, pakai warna itu; kalau tidak disebutkan, pilih warna dari palet referensi yang paling kontras dengan latar. Badge sedikit dimiringkan/dirotasi, jangan sejajar sempurna.` : `Kalau ada teks, pakai gaya font tebal besar bergaya ${fh} untuk judul/headline (dengan tekstur/finishing yang sesuai gaya font-nya, bukan flat polos; ini nama gaya font acuan visual, BUKAN teks yang harus tertulis di gambar), gaya bersih ${fb} untuk isi. Badge (kalau ada) sedikit dimiringkan/dirotasi, jangan sejajar sempurna.`;
  parts.push(typography);
  parts.push(QUALITY_PROHIBITION_LAYER);
  return parts.join(' ');
};

        rowHBase = 46;
      const totalRows = grouped.reduce((sum, g) => sum + g.list.length, 0);
      const headerCount = grouped.filter(g => !g.noHeader).length;
      const naturalBodyHeight = headerCount * catHeaderHBase + totalRows * rowHBase;
      const availableBody = A4_HEIGHT - bodyTop - bottomPad;
      const vScale = naturalBodyHeight > availableBody ? Math.max(0.45, availableBody / naturalBodyHeight) : 1;
      const catHeaderH = catHeaderHBase * vScale;
      const rowH = rowHBase * vScale;
      const nameFontSize = Math.round(24 * Math.max(vScale, 0.65));
      if (cancelled) return;
      canvas.width = A4_WIDTH * renderScale;
      canvas.height = A4_HEIGHT * renderScale;
      ctx.scale(renderScale, renderScale);
      ctx.fillStyle = cfg.pageBg;
      ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT);
      if (backgroundImage) {
        const img = await loadImg(backgroundImage);
        if (cancelled) return;
        drawCoverImage(ctx, img, 0, 0, A4_WIDTH, A4_HEIGHT);
        ctx.fillStyle = cfg.pageBg + 'B8';
        ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT);
      }
      if (cancelled) return;
      await renderCompactHeader(ctx, brand);
      await document.fonts.load(`bold 74px "${brand.fontHeading}"`);
      await document.fonts.load(`bold 26px "${brand.fontHeading}"`);
      await document.fonts.load(`bold ${nameFontSize}px "${brand.fontBody}"`);
      if (cancelled) return;

      // Judul raksasa dengan GRADASI warna + GLOW (bukan warna solid datar)
      ctx.save();
      ctx.font = `bold 74px "${brand.fontHeading}"`;
      ctx.textAlign = 'center';
      const grad = ctx.createLinearGradient(0, headerH, 0, headerH + 74);
      grad.addColorStop(0, '#FFFFFF');
      grad.addColorStop(1, cfg.dividerColor);
      ctx.fillStyle = grad;
      ctx.shadowColor = cfg.dividerColor;
      ctx.shadowBlur = 26;
      ctx.fillText('DAFTAR MENU', width / 2, headerH + 62);
      ctx.restore();
      ctx.textAlign = 'left';

      // Kolase foto tumpuk-silang DIAGONAL — maksimal 3 item (prioritas
      // yang ditandai Menu Unggulan, sisanya diambil dari item pertama
      // yang punya foto), meniru komposisi "produk saling tumpuk" referensi.
      const allItems = grouped.flatMap(g => g.list);
      const withPhoto = allItems.filter(i => i.photoUrl);
      const featuredFirst = [...withPhoto.filter(i => i.featured), ...withPhoto.filter(i => !i.featured)].slice(0, 3);
      const collageY = headerH + titleH + collageH / 2;
      const collageSlots = [{
        dx: 0,
        rot: 0,
        size: 208,
        z: 2
      }, {
        dx: -190,
        rot: -0.16,
        size: 168,
        z: 0
      }, {
        dx: 190,
        rot: 0.16,
        size: 168,
        z: 1
      }];
      // Slot TENGAH (terbesar) selalu diprioritaskan lebih dulu — jadi kalau
      // cuma ada 1-2 foto tersedia, yang tampil adalah foto prioritas utama
      // di posisi paling menonjol, bukan kebetulan jatuh ke slot samping.
      const activeSlots = collageSlots.slice(0, featuredFirst.length).sort((a, b) => a.z - b.z);
      for (const slot of activeSlots) {
        const item = featuredFirst[collageSlots.indexOf(slot)];
        if (!item) continue;
        try {
          const img = await loadImg(item.photoUrl);
          if (cancelled) return;
          ctx.save();
          ctx.translate(width / 2 + slot.dx, collageY);
          ctx.rotate(slot.rot);
          ctx.shadowColor = 'rgba(0,0,0,0.5)';
          ctx.shadowBlur = 18;
          roundRectPath(ctx, -slot.size / 2, -slot.size / 2, slot.size, slot.size, 20);
          ctx.fillStyle = '#000000';
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.save();
          roundRectPath(ctx, -slot.size / 2, -slot.size / 2, slot.size, slot.size, 20);
          ctx.clip();
          drawCoverImage(ctx, img, -slot.size / 2, -slot.size / 2, slot.size, slot.size);
          ctx.restore();
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 4;
          roundRectPath(ctx, -slot.size / 2, -slot.size / 2, slot.size, slot.size, 20);
          ctx.stroke();
          ctx.restore();
        } catch (e) {}
      }

      // Daftar harga di bawah kolase — TANPA foto per-item (sesuai referensi),
      // badge favorit diberi efek glow.
      let y = bodyTop;
      const marginX = 60;
      for (const group of grouped) {
        if (!group.noHeader) {
          ctx.fillStyle = cfg.dividerColor;
          ctx.font = `bold 26px "${brand.fontHeading}"`;
          ctx.fillText(group.cat.toUpperCase(), marginX, y + 22);
          y += catHeaderH;
        }
        for (const item of group.list) {
          const priceText = `Rp ${item.price.toLocaleString('id-ID')}`;
          ctx.font = `bold ${Math.round(nameFontSize * 0.82)}px "${brand.fontBody}"`;
          const priceW = ctx.measureText(priceText).width;
          ctx.fillStyle = cfg.textMain;
          ctx.font = `bold ${nameFontSize}px "${brand.fontBody}"`;
          ctx.fillText(item.name, marginX, y + nameFontSize, width - marginX * 2 - priceW - 20);
          if (item.featured) {
            const nameW = ctx.measureText(item.name).width;
            ctx.save();
            ctx.shadowColor = cfg.dividerColor;
            ctx.shadowBlur = 14;
            drawFeaturedBadge(ctx, marginX + nameW + 14, y + nameFontSize / 2 + 2, 0.5, 'left-middle');
            ctx.restore();
          }
          ctx.save();
          ctx.shadowColor = cfg.dividerColor;
          ctx.shadowBlur = 10;
          ctx.fillStyle = cfg.dividerColor;
          ctx.font = `bold ${Math.round(nameFontSize * 0.82)}px "${brand.fontBody}"`;
          ctx.textAlign = 'right';
          ctx.fillText(priceText, width - marginX, y + nameFontSize);
          ctx.textAlign = 'left';
          ctx.restore();
          y += rowH;
        }
      }
      await drawFooter(ctx, width, brand, footerToggles);
    };

    // ============================================================
    // BUTCHER STYLE (BARU, poin E) — terinspirasi menu steakhouse.
    // 4 item/halaman, TIDAK dikelompokkan per kategori (kategori
    // diabaikan total di gaya ini — grouped di-flatten). Alternating
    // kiri-kanan: kotak teks & kotak foto gantian posisi tiap item.
    // Kotak teks: border tipis rounded. Kotak foto: mode CONTAIN
    // (tidak crop, foto utuh), sudut rounded, ruang sisa diisi pageBg.
    // Tanpa harga lama dicoret (dibatalkan), tanpa footer bawaan
    // (footer sekarang universal lewat drawFooter + toggle).
    // ============================================================
    // ============================================================
    // REKOMENDASI CHEF (dulu Butcher Style) — REVISI TOTAL, bukan lagi
    // alternating kiri-kanan. Sekarang grid 2 kolom x 3 baris (6
    // item/halaman), kartu PUTIH seragam sudut rounded, foto di atas
    // (rounded, mode cover mengisi penuh kotak foto), badge harga pil
    // HITAM menempel pojok kiri-bawah foto, nama kapital bold di bawah
    // foto, deskripsi kecil abu-abu di bawahnya. Background halaman
    // tetap warna solid gelap yang sudah ada (bukan gambar/marmer lagi).
    // Referensi: menu "Ensaladas" (kartu putih 2 kolom).
    // ============================================================
    const renderButcherStyleLayout = async (canvas, ctx, width, grouped, cfg) => {
      const wrapWords = (words, maxWidth) => {
        const lines = [];
        let current = '';
        for (const w of words) {
          const test = current ? current + ' ' + w : w;
          if (ctx.measureText(test).width > maxWidth && current) {
            lines.push(current);
            current = w;
          } else {
            current = test;
          }
        }
        if (current) lines.push(current);
        return lines;
      };
      const items = grouped.reduce((acc, g) => acc.concat(g.list), []).slice(0, 6);
      const headerH = await computeCompactHeaderHeight(brand);
      const marginX = 50;
      const colGap = 26;
      const rowGap = 30;
      const cols = 2,
        rows = 3;
      const cardW = (width - marginX * 2 - colGap * (cols - 1)) / cols;
      const bottomPad = 100;
      const availableBody = A4_HEIGHT - headerH - 20 - bottomPad;
      const cardH = (availableBody - rowGap * (rows - 1)) / rows;
      // REVISI: zona teks dikunci TETAP ~110px (bukan proporsi persen),
      // sisanya (jauh lebih besar) diberikan ke foto — supaya tidak ada
      // ruang kosong menganggur seperti sebelumnya.
      const textZoneH = 110;
      const photoH = cardH - textZoneH;
      const nameFontSize = 20,
        descFontSize = 13,
        priceFontSize = 16;
      const truncate = (text, maxWidth) => {
        if (ctx.measureText(text).width <= maxWidth) return text;
        let t = text;
        while (t.length > 1 && ctx.measureText(t + '…').width > maxWidth) {
          t = t.slice(0, -1);
        }
        return t + '…';
      };
      if (cancelled) return;
      canvas.width = A4_WIDTH * renderScale;
      canvas.height = A4_HEIGHT * renderScale;
      ctx.scale(renderScale, renderScale);
      // Background halaman SOLID (tidak lagi pakai gambar latar default
      // ataupun upload manual) — sesuai keputusan revisi.
      ctx.fillStyle = cfg.pageBg;
      ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT);
      await renderCompactHeader(ctx, brand);
      await document.fonts.load(`bold ${nameFontSize}px "${brand.fontBody}"`);
      await document.fonts.load(`bold ${priceFontSize}px "${brand.fontBody}"`);
      await document.fonts.load(`${descFontSize}px "${brand.fontBody}"`);
      const startY = headerH + 20;
      // REVISI: area kartu di bawah foto sekarang GELAP (bukan putih),
      // sedikit lebih terang dari background halaman supaya kartu
      // masih terbaca sebagai bentuk terpisah.
      const cardBg = '#1E332A';
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        const col = i % cols,
          row = Math.floor(i / cols);
        const cx = marginX + col * (cardW + colGap);
        const cy = startY + row * (cardH + rowGap);

        // Kartu GELAP, sudut rounded, shadow halus
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.35)';
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 4;
        roundRectPath(ctx, cx, cy, cardW, cardH, 20);
        ctx.fillStyle = cardBg;
        ctx.fill();
        ctx.restore();

        // Foto — mode COVER mengisi penuh area foto atas kartu (sekarang
        // jauh lebih besar), sudut rounded cuma di 2 sudut atas.
        ctx.save();
        roundRectPathTop(ctx, cx, cy, cardW, photoH, 20);
        ctx.clip();
        if (item.photoUrl) {
          try {
            const img = await loadImg(item.photoUrl);
            if (cancelled) return;
            drawCoverImage(ctx, img, cx, cy, cardW, photoH);
          } catch (e) {}
        } else {
          ctx.fillStyle = '#333333';
          ctx.fillRect(cx, cy, cardW, photoH);
        }
        ctx.restore();

        // Zona teks — nama+deskripsi di KIRI (rata atas, 1 baris
        // dipotong "..."), badge harga di KANAN (sejajar vertikal,
        // di-tengah zona) — SERAGAM tinggi & posisi di semua kartu
        // (tidak bergantung ada/tidaknya deskripsi).
        const padIn = 18;
        const textZoneY = cy + photoH;
        const splitX = cx + cardW * 0.62;
        const leftMaxW = splitX - (cx + padIn) - 10;
        const rightX = splitX;
        const rightMaxW = cx + cardW - padIn - rightX;

        ctx.font = `bold ${nameFontSize}px "${brand.fontBody}"`;
        ctx.fillStyle = cfg.textMain;
        let ty = textZoneY + 18 + nameFontSize * 0.8;
        ctx.fillText(truncate(item.name.toUpperCase(), leftMaxW), cx + padIn, ty);

        if (item.description) {
          ty += descFontSize + 8;
          ctx.font = `${descFontSize}px "${brand.fontBody}"`;
          ctx.fillStyle = cfg.textSub;
          ctx.fillText(truncate(item.description, leftMaxW), cx + padIn, ty);
        }

        // Badge harga — pil warna AKSEN BRAND, di KANAN, di-tengah
        // vertikal zona teks.
        const priceText = `Rp ${item.price.toLocaleString('id-ID')}`;
        ctx.font = `bold ${priceFontSize}px "${brand.fontBody}"`;
        const priceW = Math.min(ctx.measureText(priceText).width, rightMaxW - 22);
        const badgeW = priceW + 22,
          badgeH = 30;
        const badgeX = rightX,
          badgeY = textZoneY + (textZoneH - badgeH) / 2;
        roundRectPath(ctx, badgeX, badgeY, badgeW, badgeH, badgeH / 2);
        ctx.fillStyle = brand.primaryColor;
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(truncate(priceText, badgeW - 16), badgeX + 11, badgeY + badgeH / 2 + priceFontSize * 0.35);

        if (item.featured) {
          drawFeaturedBadge(ctx, cx + cardW - 26, cy + 22, 0.55);
        }
      }
      await drawFooter(ctx, width, brand, footerToggles);
    };

    // ============================================================
    // GRID NOMOR (BARU, poin F) — grid 3 kolom per kategori, kolom
    // AUTO-SEIMBANG sesuai jumlah item, nomor urut RESTART per
    // kategori, foto kotak 1:1 mode CONTAIN sudut rounded independen,
    // badge harga bentuk bintang/scallop.
    // ============================================================
    const renderGridNomorLayout = async (canvas, ctx, width, grouped, cfg) => {
      const headerH = await computeCompactHeaderHeight(brand);
      const marginX = 50;
      const catHeaderHBase = 46,
        cellGapBase = 18,
        bottomPad = 100;
      // REVISI (poin 5): dulu tinggi 1 baris grid cuma dihitung dari
      // ukuran foto (cellSize), padahal badge harga + nama menu di
      // bawah foto butuh ruang sendiri — itu yang bikin keduanya
      // saling tabrakan. Sekarang zona teks dihitung eksplisit sebagai
      // bagian resmi tinggi tiap baris.
      const textZoneHBase = 92;
      // Perkirakan jumlah "baris grid" total (untuk auto-scale vertikal)
      const rowsFor = n => n <= 3 ? 1 : n === 4 ? 2 : Math.ceil(n / 3);
      const cellSizeBase = 240;
      let naturalBodyHeight = 0;
      const headerCount = grouped.filter(g => !g.noHeader).length;
      naturalBodyHeight += headerCount * catHeaderHBase;
      for (const g of grouped) naturalBodyHeight += rowsFor(g.list.length) * (cellSizeBase * 0.8 + textZoneHBase + cellGapBase);
      const availableBody = A4_HEIGHT - headerH - bottomPad;
      const vScale = naturalBodyHeight > availableBody ? Math.max(0.4, availableBody / naturalBodyHeight) : 1;
      const cellSize = cellSizeBase * vScale;
      const photoH = cellSize * 0.8;
      const textZoneH = textZoneHBase * Math.max(vScale, 0.55);
      const cellGap = cellGapBase * vScale;
      const catHeaderH = catHeaderHBase * vScale;
      const nameFontSize = Math.round(19 * Math.max(vScale, 0.6));
      if (cancelled) return;
      canvas.width = A4_WIDTH * renderScale;
      canvas.height = A4_HEIGHT * renderScale;
      ctx.scale(renderScale, renderScale);
      ctx.fillStyle = cfg.pageBg;
      ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT);
      // Poin A: background efektif (upload user atau default bawaan) —
      // overlay TERANG 55% karena pageBg gaya ini krem/terang.
      if (backgroundImage) {
        try {
          const bgImg = await loadImg(backgroundImage);
          if (cancelled) return;
          drawCoverImage(ctx, bgImg, 0, 0, A4_WIDTH, A4_HEIGHT);
          ctx.fillStyle = 'rgba(255,255,255,0.55)';
          ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT);
        } catch (e) {}
      }
      await renderCompactHeader(ctx, brand);
      await document.fonts.load(`bold 26px "${brand.fontHeading}"`);
      await document.fonts.load(`bold ${nameFontSize}px "${brand.fontBody}"`);
      let y = headerH;
      for (const group of grouped) {
        if (!group.noHeader) {
          ctx.fillStyle = cfg.dividerColor;
          ctx.font = `bold 26px "${brand.fontHeading}"`;
          ctx.fillText(group.cat.toUpperCase(), marginX, y + 22);
          y += catHeaderH;
        }
        const n = group.list.length;
        if (n === 0) continue;
        let cols = n <= 3 ? n : n === 4 ? 2 : 3;
        const rows = rowsFor(n);
        for (let r = 0; r < rows; r++) {
          const itemsInRow = Math.min(cols, n - r * cols);
          const rowW = itemsInRow * cellSize + (itemsInRow - 1) * cellGap;
          const rowStartX = marginX + (width - marginX * 2 - (cols * cellSize + (cols - 1) * cellGap)) / 2 + (cols * cellSize + (cols - 1) * cellGap - rowW) / 2;
          for (let c = 0; c < itemsInRow; c++) {
            const idx = r * cols + c;
            const item = group.list[idx];
            const cx = rowStartX + c * (cellSize + cellGap);
            const cy = y;
            // Foto kotak 1:1, mode CONTAIN, sudut rounded independen (~18px)
            ctx.save();
            roundRectPath(ctx, cx, cy, cellSize, photoH, 18);
            ctx.clip();
            ctx.fillStyle = cfg.pageBg === '#F5EDE4' ? '#EAE0D2' : cfg.pageBg;
            ctx.fillRect(cx, cy, cellSize, photoH);
            if (item.photoUrl) {
              try {
                const img = await loadImg(item.photoUrl);
                if (cancelled) return;
                const {
                  w: iw,
                  h: ih
                } = computeContainSize(img, cellSize, photoH);
                ctx.drawImage(img, cx + (cellSize - iw) / 2, cy + (photoH - ih) / 2, iw, ih);
              } catch (e) {}
            }
            ctx.restore();
            roundRectPath(ctx, cx, cy, cellSize, photoH, 18);
            ctx.strokeStyle = cfg.dividerColor;
            ctx.lineWidth = 2;
            ctx.stroke();
            // Nomor urut — RESTART per kategori (idx+1 lokal dalam grup)
            ctx.save();
            roundRectPath(ctx, cx + 8, cy + 8, 30 * Math.max(vScale, 0.6), 30 * Math.max(vScale, 0.6), 8);
            ctx.fillStyle = cfg.dividerColor;
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold ${Math.round(15 * Math.max(vScale, 0.6))}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(String(idx + 1), cx + 8 + 15 * Math.max(vScale, 0.6), cy + 8 + 15 * Math.max(vScale, 0.6));
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.restore();
            if (item.featured) drawFeaturedBadge(ctx, cx + cellSize - 8, cy + 8, 0.42, 'inset-topright');
            // Badge harga bentuk bintang/scallop, menjorok di bawah foto
            drawPriceBadge(ctx, `Rp ${item.price.toLocaleString('id-ID')}`, cx + cellSize - 30, cy + photoH, {
              scale: Math.max(vScale, 0.55),
              shape: 'scallop',
              bg: cfg.dividerColor,
              textColor: '#FFFFFF',
              fontSize: 15
            });
            // Nama menu — REVISI (poin 5): ditaruh di dalam zona teks
            // (textZoneH) yang sudah direservasi resmi, bukan langsung
            // menempel bawah foto, supaya tidak tabrakan dengan badge.
            ctx.fillStyle = cfg.textMain;
            ctx.font = `bold ${nameFontSize}px "${brand.fontBody}"`;
            ctx.textAlign = 'center';
            ctx.fillText(item.name.toUpperCase(), cx + cellSize / 2, cy + photoH + textZoneH - 16, cellSize - 10);
            ctx.textAlign = 'left';
          }
          y += photoH + textZoneH + cellGap;
        }
      }
      await drawFooter(ctx, width, brand, footerToggles);
    };

    // ============================================================
    // KOLOM KATEGORI (BARU, poin G) — 3 kolom vertikal ala koran,
    // kategori dibagi BERURUTAN ke kolom (1,4,7→kolom1, dst). Ribbon
    // warna kategori ikuti brand identity, TANPA ikon. Daftar item
    // murni teks (bullet+nama+harga, tanpa foto per item). Foto
    // OPSIONAL per kategori (categoryPhotoUrl di item, poin D) muncul di
    // bawah blok kategori kalau diisi.
    // ============================================================
    const renderKolomKategoriLayout = async (canvas, ctx, width, grouped, cfg) => {
      const headerH = await computeCompactHeaderHeight(brand);
      const marginX = 40;
      const colGap = 30;
      const colCount = 3;
      const colW = (width - marginX * 2 - colGap * (colCount - 1)) / colCount;
      const ribbonH = 44,
        rowH = 38,
        catGap = 26,
        catPhotoH = 130;
      if (cancelled) return;
      canvas.width = A4_WIDTH * renderScale;
      canvas.height = A4_HEIGHT * renderScale;
      ctx.scale(renderScale, renderScale);
      ctx.fillStyle = cfg.pageBg;
      ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT);
      // Poin A: background efektif (upload user atau default bawaan),
      // overlay 60% gelap.
      if (backgroundImage) {
        try {
          const bgImg = await loadImg(backgroundImage);
          if (cancelled) return;
          drawCoverImage(ctx, bgImg, 0, 0, A4_WIDTH, A4_HEIGHT);
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT);
        } catch (e) {}
      }
      await renderCompactHeader(ctx, brand);
      await document.fonts.load(`bold 22px "${brand.fontBody}"`);
      await document.fonts.load(`19px "${brand.fontBody}"`);
      // REVISI (poin 3): tambah jarak antara header brand dan mulainya
      // blok kategori pertama — sebelumnya langsung nempel ke headerH.
      const topGap = 36;
      const colY = new Array(colCount).fill(headerH + topGap);
      for (let gi = 0; gi < grouped.length; gi++) {
        const group = grouped[gi];
        const col = gi % colCount; // BERURUTAN: kategori 1,4,7→kolom1, dst
        const colX = marginX + col * (colW + colGap);
        let y = colY[col];
        if (!group.noHeader) {
          // Ribbon warna mengikuti brand identity (primaryColor), tanpa ikon
          ctx.save();
          roundRectPath(ctx, colX, y, colW, ribbonH, 8);
          ctx.fillStyle = brand.primaryColor;
          ctx.fill();
          ctx.restore();
          ctx.fillStyle = '#FFFFFF';
          ctx.font = `bold 22px "${brand.fontBody}"`;
          ctx.textBaseline = 'middle';
          ctx.fillText(group.cat.toUpperCase(), colX + 16, y + ribbonH / 2 + 1, colW - 32);
          ctx.textBaseline = 'alphabetic';
          y += ribbonH + 14;
        }
        for (const item of group.list) {
          ctx.beginPath();
          ctx.arc(colX + 6, y + rowH / 2 - 4, 4, 0, Math.PI * 2);
          ctx.fillStyle = brand.primaryColor;
          ctx.fill();
          ctx.fillStyle = cfg.textMain;
          ctx.font = `19px "${brand.fontBody}"`;
          const priceText = `Rp ${item.price.toLocaleString('id-ID')}`;
          const priceW = ctx.measureText(priceText).width;
          ctx.fillText(item.name, colX + 18, y + rowH / 2, colW - 18 - priceW - 12);
          ctx.textAlign = 'right';
          ctx.fillStyle = cfg.dividerColor;
          ctx.fillText(priceText, colX + colW, y + rowH / 2);
          ctx.textAlign = 'left';
          y += rowH;
        }
        // Foto per kategori (opsional, diisi lewat form Tambah Menu)
        if (group.catPhotoUrl) {
          try {
            const img = await loadImg(group.catPhotoUrl);
            if (cancelled) return;
            ctx.save();
            roundRectPath(ctx, colX, y + 8, colW, catPhotoH, 14);
            ctx.clip();
            drawCoverImage(ctx, img, colX, y + 8, colW, catPhotoH);
            ctx.restore();
            y += catPhotoH + 8;
          } catch (e) {}
        }
